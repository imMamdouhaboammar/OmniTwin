name: Security & Attribution Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Secret & Attribution Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify SPDX License Headers
        run: |
          bash scripts/check-attribution.sh

      - name: Check for Disallowed Keywords or Credentials
        run: |
          bash scripts/audit-publication.sh
