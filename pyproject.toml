[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitwin"
version = "0.1.0"
description = "An open-source cognitive engine for persistent identity, grounded memory, relational continuity, and behavior-aware AI agents."
readme = "README.md"
authors = [
    { name = "Mamdouh Aboammar" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai-agents", "cognitive-architecture", "grounded-memory", "digital-twin", "llm"]
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.50.0",
    "protobuf>=4.21.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "grpcio-tools>=1.50.0",
]
mcp = [
    "fastmcp>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/imMamdouhaboammar/OmniTwin"
Repository = "https://github.com/imMamdouhaboammar/OmniTwin.git"
Issues = "https://github.com/imMamdouhaboammar/OmniTwin/issues"

[project.scripts]
omnitwin = "omnitwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
